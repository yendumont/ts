name: Build APK

on:
  workflow_dispatch:
    inputs:
      ts_ref:
        description: "Upstream tailscale-android ref (must have a patches/<version>/ directory)"
        default: "1.104.5-t788384763-gd8673104f"
        required: true
      gomobile_target:
        description: "android/arm (Fire TV Stick 2nd gen, armeabi-v7a) or android/arm64 etc."
        default: "android/arm"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        env:
          TS_REF: ${{ inputs.ts_ref }}
          GOMOBILE_TARGET: ${{ inputs.gomobile_target }}
          MIN_SDK: "22"
          GRADLE_HEAP: 5g
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: bash scripts/build.sh

      - name: Sign with permanent key
        env:
          TS_KEYSTORE_BASE64: ${{ secrets.TS_KEYSTORE_BASE64 }}
          TS_KEYSTORE_PASSWORD: ${{ secrets.TS_KEYSTORE_PASSWORD }}
          TS_KEY_ALIAS: ${{ secrets.TS_KEY_ALIAS }}
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          if [ -z "$TS_KEYSTORE_BASE64" ] || [ -z "$TS_KEYSTORE_PASSWORD" ]; then
            echo "::warning::Signing secrets not set; APK is debug-signed and cannot update an existing install."
            exit 0
          fi
          export TS_KEY_ALIAS="${TS_KEY_ALIAS:-firetv}"
          for apk in dist/*.apk; do bash scripts/sign-apk.sh "$apk"; done

      - uses: actions/upload-artifact@v4
        with:
          name: tailscale-fireos5-apk
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
